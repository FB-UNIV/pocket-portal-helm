apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pocket-portal.fullname" . }}
  labels:
    {{- include "pocket-portal.labels" . | nindent 4 }}
    app.kubernetes.io/component: portal
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "pocket-portal.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "pocket-portal.selectorLabels" . | nindent 8 }}
      annotations:
        # Roll the pods when their config changes; the file is read at boot.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if not .Values.secrets.existingSecret }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      # Migrations once per pod, before the portal starts: the image's
      # `migrate` mode. Concurrent pods are safe, since scripts/migrate.mjs
      # takes a Postgres advisory lock. Retries (with backoff) until the
      # database accepts connections.
      initContainers:
        - name: migrate
          image: {{ include "pocket-portal.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["migrate"]
          envFrom:
            - secretRef:
                name: {{ include "pocket-portal.secretName" . }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      containers:
        - name: portal
          image: {{ include "pocket-portal.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: CONFIG_FILE
              value: /etc/pocket-portal/config.yaml
            # The init container already migrated.
            - name: MIGRATE_ON_START
              value: "false"
          envFrom:
            - secretRef:
                name: {{ include "pocket-portal.secretName" . }}
          ports:
            - name: http
              containerPort: 3000
          # Liveness only asks "is the process answering"; readiness also
          # needs Postgres and PocketID, so an outage takes pods out of the
          # Service without restarting them.
          startupProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /api/ready, port: http }
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/pocket-portal
              readOnly: true
            # Next's cache and scratch space, since the root is read-only.
            # Safe to lose: nothing here must survive a restart.
            - name: next-cache
              mountPath: /app/.next/cache
            - name: tmp
              mountPath: /tmp
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "pocket-portal.fullname" . }}
        - name: next-cache
          emptyDir: {}
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
