{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "pocket-portal.fullname" . }}
  labels:
    {{- include "pocket-portal.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "pocket-portal.selectorLabels" . | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - ports:
        - port: 3000
      {{- with .Values.networkPolicy.portalIngressFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- if .Values.postgresql.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "pocket-portal.postgresql.name" . }}
  labels:
    {{- include "pocket-portal.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: postgresql
  policyTypes: ["Ingress"]
  # Only the portal's pods, migrations included (they run in its init
  # container), may reach the database.
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "pocket-portal.selectorLabels" . | nindent 14 }}
      ports:
        - port: 5432
{{- end }}
{{- end }}
