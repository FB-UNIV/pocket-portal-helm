{{- if not .Values.secrets.existingSecret }}
{{- $s := .Values.secrets }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "pocket-portal.fullname" . }}
  labels:
    {{- include "pocket-portal.labels" . | nindent 4 }}
type: Opaque
# Keys are the portal's environment variable names, so the Deployment takes
# the whole Secret with envFrom. An existingSecret must use the same keys.
stringData:
  POCKETID_API_KEY: {{ required "secrets.pocketidApiKey is required (or set secrets.existingSecret)" $s.pocketidApiKey | quote }}
  POCKETID_OIDC_CLIENT_SECRET: {{ required "secrets.pocketidOidcClientSecret is required (or set secrets.existingSecret)" $s.pocketidOidcClientSecret | quote }}
  AUTH_SECRET: {{ required "secrets.authSecret is required (or set secrets.existingSecret); e.g. openssl rand -base64 32" $s.authSecret | quote }}
  {{- if .Values.postgresql.enabled }}
  {{- $password := required "postgresql.auth.password is required while postgresql.enabled; e.g. openssl rand -hex 24" .Values.postgresql.auth.password }}
  POSTGRES_PASSWORD: {{ $password | quote }}
  {{- /* Percent-encoded, so a / ? @ or # in the password can't break the URL. */}}
  DATABASE_URL: {{ printf "postgres://%s:%s@%s:5432/%s" .Values.postgresql.auth.username ($password | urlquery | replace "+" "%20") (include "pocket-portal.postgresql.name" .) .Values.postgresql.auth.database | quote }}
  {{- else }}
  DATABASE_URL: {{ required "secrets.databaseUrl is required while postgresql.enabled is false" $s.databaseUrl | quote }}
  {{- end }}
  {{- with $s.metricsToken }}
  METRICS_TOKEN: {{ . | quote }}
  {{- end }}
  {{- with $s.smtpPassword }}
  SMTP_PASSWORD: {{ . | quote }}
  {{- end }}
{{- end }}
